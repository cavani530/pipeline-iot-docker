x-app: &app
  build: .
  environment:
    PGHOST: db
    PGUSER: iot
    PGDATABASE: iot
    PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 3s
      timeout: 3s
      retries: 30
  carga:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./data:/app/data:ro
    command: ["python", "src/carga.py", "/app/data/IOT-temp.csv"]
  painel:
    <<: *app
    depends_on:
      carga: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8501:8501"]
    command: ["streamlit", "run", "src/dashboard.py", "--server.address=0.0.0.0", "--server.headless=true"]
volumes:
  pgdata:
