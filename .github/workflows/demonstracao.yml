name: Executar pipeline e gerar evidências
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  demonstracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Obter CSV público
        run: |
          curl -fLsS --retry 2 https://www.kaggle.com/api/v1/datasets/download/atulanandjha/temperature-readings-iot-devices -o /tmp/iot.zip || true
          if ! unzip -p /tmp/iot.zip '*IOT-temp.csv' > data/IOT-temp.csv; then
            curl -fLsS --retry 2 https://raw.githubusercontent.com/nurfnick/Data_Viz/main/IOT-temp.csv -o data/IOT-temp.csv
          fi
          test -s data/IOT-temp.csv
      - name: Executar a carga duas vezes e conferir contagens
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 20)" > .env
          docker compose up --build -d
          docker compose run --rm carga
          docker compose exec -T db psql -U iot -d iot -c 'SELECT * FROM media_por_ponto'
      - name: Capturar gráficos, relatório e pitch narrado
        run: |
          pip install pandas==2.2.3 playwright pillow
          python -m playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python docs/gerar.py
          python docs/video.py
      - uses: actions/upload-artifact@v4
        with:
          name: Entrega-IoT
          path: |
            docs/painel-*.png
            docs/Relatorio-IoT.pdf
            docs/Pitch-IoT.mp4
            docs/Roteiro.txt
      - name: Disponibilizar relatório, capturas e vídeo no projeto
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/painel-*.png docs/Relatorio-IoT.pdf docs/Pitch-IoT.mp4 docs/Roteiro.txt
          git commit -m "Registrar execução com a base completa" && git push
